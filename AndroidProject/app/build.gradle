import com.android.build.api.artifact.SingleArtifact
import java.security.MessageDigest
import javax.inject.Inject

plugins { id 'com.android.application' }

def versionProperties = new Properties()
file('version.properties').withInputStream { versionProperties.load(it) }
def code = Integer.parseInt(versionProperties.getProperty('VERSION_CODE','0'))
def name = versionProperties.getProperty('VERSION_NAME','')
def playName = versionProperties.getProperty('PLAY_VERSION_NAME','')
if (!(playName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) throw new GradleException('Invalid PLAY_VERSION_NAME')
if (code < 2 || !name || name.length() > 70) throw new GradleException('Invalid version.properties')

def manifestUrl = providers.gradleProperty('sightlineUpdateManifestUrl')
    .orElse(providers.environmentVariable('SIGHTLINE_UPDATE_MANIFEST_URL')).getOrElse('').trim()
if (manifestUrl && !(manifestUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::443)?\/[A-Za-z0-9_~.\/\-]+\.json/)) {
    throw new GradleException('Use one trusted HTTPS manifest URL with a DNS hostname, no query/fragment/userinfo.')
}
def releaseKeyPath = providers.environmentVariable('SIGHTLINE_KEYSTORE_PATH').orNull
def releaseStorePassword = providers.environmentVariable('SIGHTLINE_KEYSTORE_PASSWORD').orNull
def releaseKeyPassword = providers.environmentVariable('SIGHTLINE_KEY_PASSWORD').orNull
def releaseAlias = providers.environmentVariable('SIGHTLINE_KEY_ALIAS').orElse('sightline-release').get()
def releaseSigningProvided = releaseKeyPath && releaseStorePassword && releaseKeyPassword && releaseAlias
def diagnosticKeyPath = providers.environmentVariable('SIGHTLINE_DIAGNOSTIC_KEYSTORE_PATH').orNull
def diagnosticKeyPassword = providers.environmentVariable('SIGHTLINE_DIAGNOSTIC_KEYSTORE_PASSWORD').orNull
def diagnosticSigningProvided = diagnosticKeyPath && diagnosticKeyPassword
def releaseTlsHost = providers.gradleProperty('sightlineLanTlsHost').getOrElse('').trim().toLowerCase(Locale.ROOT)
def validReleaseDnsHost = { String dnsHost ->
    if (!dnsHost || dnsHost.length() > 253 || dnsHost.contains(':') ||
        dnsHost.startsWith('.') || dnsHost.endsWith('.') ||
        !(dnsHost ==~ /[a-z0-9.-]+/) || !dnsHost.contains('.')) return false
    if (dnsHost ==~ /(?i)(?:(?:0x[0-9a-f]+|[0-9]+)\.)+(?:0x[0-9a-f]+|[0-9]+)/) return false
    if (dnsHost == 'localhost' || dnsHost.endsWith('.localhost') ||
        dnsHost.endsWith('.local') || dnsHost.endsWith('.test') ||
        dnsHost.endsWith('.invalid') || dnsHost.endsWith('.example') ||
        ['example.com','example.net','example.org','example.edu','example.gov','example.mil'].any { host ->
            dnsHost == host || dnsHost.endsWith('.' + host)
        }) return false
    def labels = dnsHost.split('\\.', -1)
    return labels.every { label -> label.length() >= 1 && label.length() <= 63 &&
        label ==~ /[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/ }
}
def privacyPolicyInput = providers.gradleProperty('sightlinePrivacyPolicyUrl')
    .orElse(providers.environmentVariable('SIGHTLINE_PRIVACY_POLICY_URL')).getOrElse('').trim()
def privacyPolicyUrl = ''
if (privacyPolicyInput) {
    URI policy
    try {
        policy = new URI(privacyPolicyInput)
    } catch (URISyntaxException ignored) {
        throw new GradleException('Set a valid public HTTPS privacy policy URL.')
    }
    if (policy.scheme != 'https' || !validReleaseDnsHost(policy.host?.toLowerCase(Locale.ROOT)) ||
        !(policy.port in [-1, 443]) || policy.rawUserInfo != null || policy.rawQuery != null ||
        policy.rawFragment != null) {
        throw new GradleException('Use a public HTTPS privacy policy URL without credentials, query or fragment.')
    }
    privacyPolicyUrl = policy.toASCIIString()
}

def hostRequested = providers.gradleProperty('enableLanHost').orElse('true').get().toBoolean()
def phoneNodeSdkPath = providers.gradleProperty('phoneNodeSdkRoot').getOrElse('')
def phoneNodeSdk = phoneNodeSdkPath ? file(phoneNodeSdkPath) : null
def nodeSo = phoneNodeSdk ? new File(phoneNodeSdk,'bin/arm64-v8a/libnode.so') : file('src/main/jniLibs/arm64-v8a/libnode.so')
def nodeHeader = phoneNodeSdk ? new File(phoneNodeSdk,'include/node/node.h') : file('libnode/include/node/node.h')
def nodeLock = file('phone-node-runtime.properties')
if (hostRequested) {
    for (def input : [nodeSo, nodeHeader, nodeLock]) {
        if (!input.isFile()) throw new GradleException("Cannot enable phone hosting: missing verified native input ${input}")
    }
    def lock = new Properties()
    nodeLock.withInputStream { lock.load(it) }
    if (!phoneNodeSdk || lock.getProperty('VERSION') != '24.22.0-0' ||
        lock.getProperty('NDK_VERSION') != '28.2.13676358') {
        throw new GradleException('Android host native SDK version/NDK lock mismatch')
    }
    def sha = { f ->
        def md = java.security.MessageDigest.getInstance('SHA-256')
        f.withInputStream { input ->
            byte[] buf = new byte[65536]
            int n
            while ((n = input.read(buf)) != -1) md.update(buf, 0, n)
        }
        md.digest().collect { String.format('%02x',it & 255) }.join('')
    }
    if (sha(nodeSo) != lock.getProperty('LIBNODE_SHA256') ||
        sha(nodeHeader) != lock.getProperty('NODE_HEADER_SHA256')) {
        throw new GradleException('Android host runtime/header digest differs from verified install')
    }
    def headerRoot = new File(phoneNodeSdk,'include/node')
    def headerFiles = fileTree(headerRoot).files.findAll { it.isFile() }.sort { a,b ->
        headerRoot.toPath().relativize(a.toPath()).toString().replace('\\','/') <=> headerRoot.toPath().relativize(b.toPath()).toString().replace('\\','/') }
    def headerInventory = headerFiles.collect { f -> sha(f)+'  '+headerRoot.toPath().relativize(f.toPath()).toString().replace('\\','/')+'\n' }.join('')
    def headerDigest = java.security.MessageDigest.getInstance('SHA-256').digest(headerInventory.getBytes('UTF-8')).collect { String.format('%02x',it & 255) }.join('')
    if(headerDigest != lock.getProperty('HEADERS_TREE_SHA256')) throw new GradleException('Native SDK headers changed')
    // Build fails before CMake if a random or misaligned binary is placed in jniLibs.
    def elf = new java.io.RandomAccessFile(nodeSo, 'r')
    try {
        byte[] id = new byte[64]; elf.readFully(id)
        if (id[0] != 127 || id[1] != 69 || id[2] != 76 || id[3] != 70 ||
            id[4] != 2 || id[5] != 1) throw new GradleException('libnode must be ELF64 little-endian')
        def le = java.nio.ByteBuffer.wrap(id).order(java.nio.ByteOrder.LITTLE_ENDIAN)
        if (le.getShort(16) != 3 || le.getShort(18) != 183)
            throw new GradleException('libnode must be AArch64 ET_DYN')
        long phoff = le.getLong(32)
        int entsz = Short.toUnsignedInt(le.getShort(54))
        int count = Short.toUnsignedInt(le.getShort(56))
        if (entsz < 56 || count < 2 || count > 100 || phoff < 64 || phoff > elf.length()-entsz*count)
            throw new GradleException('Invalid ELF program header table')
        int loads = 0
        for (int i=0; i<count; i++) {
            byte[] ph = new byte[56]
            elf.seek(phoff + i*entsz);elf.readFully(ph)
            def seg = java.nio.ByteBuffer.wrap(ph).order(java.nio.ByteOrder.LITTLE_ENDIAN)
            if (seg.getInt(0) != 1) continue
            loads++
            long off = seg.getLong(8), address=seg.getLong(16), align=seg.getLong(48)
            if (align < 16384 || (off & 16383L) != (address & 16383L))
                throw new GradleException('Native library has non-16-KiB PT_LOAD segment alignment')
        }
        if (loads < 2) throw new GradleException('ELF has too few PT_LOAD segments')
    } finally { elf.close() }
}
android {
    namespace 'com.sightline.v3'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.sightline.v3' // DO NOT CHANGE: Android updates require same application ID.
        minSdk 26
        targetSdk 36
        versionCode code // Monotonic: tools/bump-version.ps1 for each release.
        versionName name
        buildConfigField 'boolean', 'LAN_HOST_ENABLED', hostRequested.toString()
        buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'false'
        buildConfigField 'boolean', 'SECURE_LAN_RELEASE', 'false'
        buildConfigField 'String', 'LAN_TLS_HOST', '""'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"' + manifestUrl + '"'
        buildConfigField 'String', 'PRIVACY_POLICY_URL', '""'
    }
    buildFeatures { buildConfig true }
    if (hostRequested) {
        defaultConfig { ndk { abiFilters 'arm64-v8a' }; externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DNODE_MOBILE_SDK='+phoneNodeSdk.absolutePath.replace('\\','/') } } }
        externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    }
    signingConfigs {
        if (diagnosticSigningProvided) {
            create('sightlineDiagnostic') {
                storeFile file(diagnosticKeyPath)
                storeType 'PKCS12'
                storePassword diagnosticKeyPassword
                keyAlias 'sightline-diagnostic'
                keyPassword diagnosticKeyPassword
            }
        }
        if (releaseSigningProvided) {
            create('sightlineRelease') {
                storeFile file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug { debuggable true } // Debug certificate is NOT the release certificate.
        diagnostic {
            initWith debug
            applicationIdSuffix '.diagnostic.acceptance'
            signingConfig = diagnosticSigningProvided ? signingConfigs.sightlineDiagnostic : null
            matchingFallbacks = ['debug']
        }
        release {
            debuggable false
            minifyEnabled false
            buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'true'
            buildConfigField 'String', 'UPDATE_MANIFEST_URL', '""'
            buildConfigField 'boolean', 'SECURE_LAN_RELEASE', 'true'
            buildConfigField 'String', 'LAN_TLS_HOST', '"' + releaseTlsHost + '"'
            buildConfigField 'String', 'PRIVACY_POLICY_URL', groovy.json.JsonOutput.toJson(privacyPolicyUrl)
            if (releaseSigningProvided) signingConfig signingConfigs.sightlineRelease
        }
    }
    sourceSets { diagnostic {
        assets.srcDir(layout.buildDirectory.dir('generated/diagnosticAssets'))
        // initWith(debug) does not inherit debug source-set resources.
        res.srcDir('src/debug/res')
    } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents.onVariants(androidComponents.selector().withBuildType("release")) { variant ->
    variant.outputs.each { output -> output.versionName.set(playName) }
}

// Advance the persistent acceptance package independently of the Play release.
androidComponents.onVariants(androidComponents.selector().withBuildType("diagnostic")) { variant ->
    variant.outputs.each { output ->
        output.versionCode.set(Math.max(code, 24))
        output.versionName.set(playName + '-p0-walk-diagnostic')
    }
}

// Derive the diagnostic-only report from the unchanged gameplay asset.
def diagnosticPage = layout.buildDirectory.file('generated/diagnosticAssets/www/index.html')
def prepareDiagnosticAssets = tasks.register('prepareDiagnosticAssets') {
    def sourcePage = file('src/main/assets/www/index.html')
    inputs.file(sourcePage)
    outputs.file(diagnosticPage)
    doLast {
        def text = sourcePage.getText('UTF-8')
        def marker = 'r={frames:b.count};'
        if (text.indexOf(marker) < 0 || text.indexOf(marker) != text.lastIndexOf(marker))
            throw new GradleException('Diagnostic report marker changed; refusing to create an incomplete report.')
        def replacement = 'r={frames:b.count};var totalInterval=a.reduce(function(sum,q){return sum+q.intervalMs},0);r.fps=totalInterval>0?+(1000*a.length/totalInterval).toFixed(1):null;'
        def output = diagnosticPage.get().asFile
        output.parentFile.mkdirs()
        output.setText(text.replace(marker, replacement), 'UTF-8')
    }
}
tasks.configureEach { task -> if (task.name == 'mergeDiagnosticAssets') task.dependsOn(prepareDiagnosticAssets) }

// Validate the complete task graph before any package task can emit a release APK/AAB.
// Guarding only assembleRelease is too late: its dependencies may already have packaged an APK.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (releaseRequested) {
        if (!releaseSigningProvided || !file(releaseKeyPath).isFile()) {
            throw new GradleException('Release signing key missing. Run tools/provision-signing-key.ps1 locally and set SIGHTLINE_KEYSTORE_* environment values. Never use debug signing for release.')
        }
        if (!validReleaseDnsHost(releaseTlsHost)) {
            throw new GradleException('Secure LAN release requires -PsightlineLanTlsHost=<approved non-reserved FQDN>.')
        }
        if (!privacyPolicyUrl) {
            throw new GradleException('Android production release requires the approved public HTTPS privacy policy URL.')
        }
        if (hostRequested) {
            throw new GradleException('The native phone-host service uses development HTTP/WS and cannot be packaged in a release build.')
        }
        def acceptanceGate = new File(rootProject.projectDir.parentFile, 'tools/require-release-acceptance.ps1')
        if (!acceptanceGate.isFile()) throw new GradleException('Fail-closed release acceptance gate is missing; Android production release is blocked.')
        def acceptanceProcess = new ProcessBuilder('powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', acceptanceGate.absolutePath, '-Mode', 'AndroidRelease')
            .directory(rootProject.projectDir.parentFile).redirectErrorStream(true).start()
        def acceptanceOutput = acceptanceProcess.inputStream.getText('UTF-8')
        def acceptanceExit = acceptanceProcess.waitFor()
        if (acceptanceExit != 0) throw new GradleException("Android production release acceptance blocked:\n${acceptanceOutput}")
        logger.lifecycle(acceptanceOutput.trim())
    }

    // Private debug packages use source integrity, not production acceptance.
    def debugPackageTasks = graph.allTasks.findAll { task ->
        def taskVariantName = task.name.toLowerCase(Locale.ROOT)
        (taskVariantName.contains('debug') || taskVariantName.contains('diagnostic')) && (taskVariantName.startsWith('assemble') || taskVariantName.startsWith('bundle') || taskVariantName.startsWith('package'))
    }
    if (!debugPackageTasks.isEmpty()) {
        if (debugPackageTasks.any { it.name.toLowerCase(Locale.ROOT).contains('diagnostic') } &&
            (!diagnosticSigningProvided || !file(diagnosticKeyPath).isFile())) {
            throw new GradleException('Diagnostic packaging requires the persistent diagnostic signing key. See docs/DEV24-DIAGNOSTIC-MIGRATION.md.')
        }
        def gate = new File(rootProject.projectDir.parentFile, 'tools/package-candidate.ps1')
        if (!gate.isFile()) throw new GradleException('Candidate source-integrity gate is missing; private Android debug build is blocked.')
        def gateShell = providers.gradleProperty('sightlinePowerShell').orElse('powershell.exe').get()
        def process = new ProcessBuilder(gateShell, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', gate.absolutePath, '-VerifyOnly')
            .directory(rootProject.projectDir.parentFile).redirectErrorStream(true).start()
        def gateOutput = process.inputStream.getText('UTF-8')
        def gateExit = process.waitFor()
        if (gateExit != 0) throw new GradleException("Android private debug source-integrity check failed:\n${gateOutput}")
        logger.lifecycle(gateOutput.trim())
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.core:core:1.16.0'
}

abstract class PreparePlayAssets extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getMergedAssets()

    @OutputDirectory
    abstract DirectoryProperty getPlayAssets()

    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getExclusionList()

    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getThirdPartyNotices()

    @Input
    abstract ListProperty<String> getRuntimeArtifactInventory()

    @Inject
    abstract FileSystemOperations getFileOperations()

    @TaskAction
    void prepare() {
        def notices = thirdPartyNotices.get().asFile
        def noticeNames = ['APACHE-2.0.txt', 'RUNTIME-DEPENDENCIES.txt']
        for (def name : noticeNames) {
            def notice = new File(notices, name)
            if (!notice.isFile() || notice.length() == 0) {
                throw new GradleException("Required Play license or dependency evidence missing: ${name}")
            }
        }
        def approved = new File(notices, 'RUNTIME-DEPENDENCIES.txt').readLines('UTF-8')
            .findAll { it && !it.startsWith('#') }.sort()
        def resolved = runtimeArtifactInventory.get()
        if (approved != resolved) {
            throw new GradleException("Play runtime inputs lack matching reviewed license evidence. " +
                "Unreviewed inputs: ${resolved - approved}. Missing or changed inputs: ${approved - resolved}.")
        }
        def excluded = exclusionList.get().asFile.readLines('UTF-8').findAll { it }
        fileOperations.sync {
            into(playAssets.get().asFile)
            from(mergedAssets.get().asFile) { exclude(excluded) }
            from(notices) {
                include(noticeNames)
                into('third-party')
            }
        }
    }
}

def playPackaging = layout.projectDirectory.dir('play-packaging')
androidComponents.onVariants(androidComponents.selector().withBuildType('release')) { variant ->
    def runtimeInventory = configurations.named("${variant.name}RuntimeClasspath").flatMap { runtime ->
        runtime.incoming.artifacts.resolvedArtifacts
    }.map { artifacts ->
        artifacts.collect { artifact ->
            def sha = MessageDigest.getInstance('SHA-256')
            artifact.file.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) sha.update(buffer, 0, count)
            }
            def hex = HexFormat.of().formatHex(sha.digest())
            "${artifact.id.componentIdentifier.displayName}  ${artifact.file.name}  ${hex}".toString()
        }.sort()
    }
    def stage = tasks.register('preparePlayAssets', PreparePlayAssets) {
        exclusionList.set(playPackaging.file('EXCLUDED-ASSETS.txt'))
        thirdPartyNotices.set(playPackaging)
        runtimeArtifactInventory.set(runtimeInventory)
    }
    variant.artifacts.use(stage)
        .wiredWithDirectories({ it.mergedAssets }, { it.playAssets })
        .toTransform(SingleArtifact.ASSETS.INSTANCE)
}
