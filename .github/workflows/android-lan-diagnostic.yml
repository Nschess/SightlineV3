name: Android LAN diagnostic APK

on:
  push:
    branches:
      - codex/sightline-dev19-mobile-polish
      - codex/sightline-p0-emergency-recovery
    paths:
      - '.github/workflows/android-lan-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lan-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic-apk:
    if: github.repository == 'Nschess/SightlineV3' && (github.ref == 'refs/heads/codex/sightline-dev19-mobile-polish' || github.ref == 'refs/heads/codex/sightline-p0-emergency-recovery')
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      SIGHTLINE_DIAGNOSTIC_CERT_SHA256: '772e5f251ec7eae3d2ece447869be0bd9e28e2a79f947befa1c226aa4fd7acc3'
    steps:
      - name: Check out isolated recovery checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Android asset parity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checked-out source differs from the workflow commit.' }
          node tests/phase2-android-asset-parity.mjs
          exit $LASTEXITCODE

      - name: Verify critical mobile regressions
        shell: pwsh
        env:
          SIGHTLINE_MOVEMENT_REFERENCE: 24c9034ae5f1a92e90491d5c9a7aa4b37b9acb6a
        run: |
          node --test tests/mobile-movement-reference.test.cjs tests/mobile-movement-bootstrap.test.cjs tests/mobile-render-clarity.test.cjs tests/android-refresh-lifecycle.test.cjs tests/phase3-outbreak-integration.test.cjs tests/lobby10-match-rules-back.test.mjs tests/mobile-hud-interruptions.test.cjs tests/mobile-smart-setup.test.cjs
          exit $LASTEXITCODE

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JDK 17
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $javaVersion = (& java -version 2>&1 | Out-String)
          $javacVersion = (& javac -version 2>&1 | Out-String)
          Write-Output $javaVersion
          Write-Output $javacVersion
          if ($javaVersion -notmatch 'version "17\.') { throw 'JDK 17 runtime is required.' }
          if ($javacVersion -notmatch 'javac 17\.') { throw 'JDK 17 compiler is required.' }

      - name: Verify native LAN host and broadcast policy
        shell: pwsh
        run: |
          $env:SIGHTLINE_TEST_JAVA_HOME = $env:JAVA_HOME
          node --test --test-name-pattern='execute the native Java' tests/lan-join-recovery.test.cjs
          exit $LASTEXITCODE

      - name: Set up Android SDK and pinned native toolchain
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1

      - name: Verify Android SDK and stage pinned Node Mobile runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if (-not $sdkRoot -or -not (Test-Path -LiteralPath $sdkRoot)) { throw 'Android SDK root is unavailable.' }
          $readelf = Join-Path $sdkRoot 'ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-readelf.exe'
          if (-not (Test-Path -LiteralPath $readelf)) { throw 'Pinned NDK 28.2.13676358 llvm-readelf is unavailable.' }
          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'sightline-node-mobile-24.22.0-0'
          & (Join-Path $env:GITHUB_WORKSPACE 'AndroidProject/tools/setup-native-host-sdk.ps1') -RuntimeRoot $runtimeRoot -AndroidSdkRoot $sdkRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Node Mobile SDK verification failed.' }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGHTLINE_PHONE_NODE_SDK=$runtimeRoot\sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build diagnostic APK
        shell: pwsh
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}\sightline-gradle-home
          SIGHTLINE_DIAGNOSTIC_KEYSTORE_B64: ${{ secrets.SIGHTLINE_DIAGNOSTIC_KEYSTORE_B64 }}
          SIGHTLINE_DIAGNOSTIC_KEYSTORE_PASSWORD: ${{ secrets.SIGHTLINE_DIAGNOSTIC_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_B64 -or -not $env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_PASSWORD) {
            throw 'Persistent diagnostic signing secrets are missing.'
          }
          $env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'sightline-diagnostic.p12'
          $certFile = Join-Path $env:RUNNER_TEMP 'sightline-diagnostic.cer'
          Push-Location AndroidProject
          try {
            [IO.File]::WriteAllBytes($env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_PATH, [Convert]::FromBase64String($env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_B64))
            Remove-Item Env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_B64
            & keytool -exportcert -alias sightline-diagnostic -keystore $env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_PATH -storepass:env SIGHTLINE_DIAGNOSTIC_KEYSTORE_PASSWORD -file $certFile
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $certFile).Hash -ne $env:SIGHTLINE_DIAGNOSTIC_CERT_SHA256) {
              throw 'Provided diagnostic keystore does not match the pinned certificate.'
            }
            & .\gradlew.bat --no-daemon --stacktrace -PenableLanHost=true "-PphoneNodeSdkRoot=$env:SIGHTLINE_PHONE_NODE_SDK" :app:assembleDiagnostic
            if ($LASTEXITCODE -ne 0) { throw "Gradle diagnostic build failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_PATH,$certFile -ErrorAction SilentlyContinue
            Remove-Item Env:SIGHTLINE_DIAGNOSTIC_KEYSTORE_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Verify APK and package the matching Windows host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apkDir = Join-Path $env:GITHUB_WORKSPACE 'AndroidProject/app/build/outputs/apk/diagnostic'
          $apks = @(Get-ChildItem -LiteralPath $apkDir -Filter '*.apk' -File)
          if ($apks.Count -ne 1) { throw "Expected one diagnostic APK, found $($apks.Count)." }
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          $aapt = Join-Path $sdkRoot 'build-tools/36.0.0/aapt.exe'
          if (-not (Test-Path -LiteralPath $aapt)) { throw 'Android Build Tools 36.0.0 aapt is unavailable.' }
          $badging = (& $aapt dump badging $apks[0].FullName | Out-String)
          if ($LASTEXITCODE -ne 0 -or $badging -notmatch "package: name='com\.sightline\.v3\.diagnostic\.acceptance'" -or $badging -notmatch '(?m)^application-debuggable') {
            throw 'Diagnostic APK package identity verification failed.'
          }
          $manifest = (& $aapt dump xmltree $apks[0].FullName AndroidManifest.xml | Out-String)
          if ($LASTEXITCODE -ne 0 -or $manifest -notmatch 'com\.sightline\.v3\.diagnostic\.acceptance\.fileprovider') {
            throw 'Diagnostic file provider does not have a package-specific authority.'
          }
          $signer = Join-Path $sdkRoot 'build-tools/36.0.0/apksigner.bat'
          $certificate = (& $signer verify --print-certs $apks[0].FullName | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw 'Diagnostic APK signature verification failed.'
          }
          $signerHash = [regex]::Match($certificate, '(?m)^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})\s*$').Groups[1].Value
          if ($signerHash -ne $env:SIGHTLINE_DIAGNOSTIC_CERT_SHA256) { throw 'APK does not use the pinned diagnostic signer.' }
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -ne $env:GITHUB_SHA) { throw 'Runner checkout differs from the workflow commit.' }
          $versionCode = [regex]::Match($badging, "versionCode='(\d+)'").Groups[1].Value
          if ([int]$versionCode -le 24 -or $badging -notmatch "versionName='[^']+-p0-emergency-recovery'") { throw 'Expected an update-compatible P0 emergency recovery diagnostic version.' }
          $hostRoot = Join-Path $env:GITHUB_WORKSPACE 'AndroidProject/app/src/main/assets/phone-host'
          $hostPaths = Get-Content -LiteralPath (Join-Path $hostRoot 'SHA256SUMS') | ForEach-Object { $_.Substring(66) }
          $archive = [IO.Compression.ZipFile]::OpenRead($apks[0].FullName)
          try {
            foreach ($file in @($hostPaths) + 'SHA256SUMS') {
              $entry = $archive.GetEntry("assets/phone-host/$file")
              if (-not $entry) { throw "Missing APK host asset: $file" }
              $stream = $entry.Open()
              try { $actual = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash } finally { $stream.Dispose() }
              $source = (Get-FileHash -LiteralPath (Join-Path $hostRoot $file) -Algorithm SHA256).Hash
              if ($actual -ne $source) { throw "APK host asset differs from the Windows checkout: $file" }
            }
            $androidRoot = Join-Path $env:GITHUB_WORKSPACE 'AndroidProject'
            $offlinePaths = @(Get-Content -LiteralPath (Join-Path $androidRoot 'CURRENT-SOURCE-SHA256.txt') |
              ForEach-Object { $_.Substring(66) } |
              Where-Object { $_ -like 'app/src/main/assets/www/*' -and $_ -ne 'app/src/main/assets/www/index.html' })
            $offlineAtlas = 'app/src/main/assets/www/character-realism-v12.js'
            foreach ($file in ($offlinePaths + $offlineAtlas | Sort-Object -Unique)) {
              $entry = $archive.GetEntry($file.Substring('app/src/main/'.Length))
              if (-not $entry) { throw "Missing APK offline asset: $file" }
              $stream = $entry.Open()
              try { $actual = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash } finally { $stream.Dispose() }
              if ($actual -ne (Get-FileHash -LiteralPath (Join-Path $androidRoot $file) -Algorithm SHA256).Hash) {
                throw "APK offline asset differs from the checkout: $file"
              }
            }
            foreach ($name in @('libnode.so', 'libsightline_host.so')) {
              if (-not $archive.GetEntry("lib/arm64-v8a/$name")) { throw "Missing Android phone-host library: $name" }
            }
            $diagnosticPage = $archive.GetEntry('assets/www/index.html')
            if (-not $diagnosticPage) { throw 'Missing Android diagnostic page.' }
            $pageStream = $diagnosticPage.Open()
            try { $pageHash = (Get-FileHash -InputStream $pageStream -Algorithm SHA256).Hash } finally { $pageStream.Dispose() }
            $generated = Join-Path $env:GITHUB_WORKSPACE 'AndroidProject/app/build/generated/diagnosticAssets/www/index.html'
            if ($pageHash -ne (Get-FileHash -LiteralPath $generated -Algorithm SHA256).Hash) {
              throw 'Packaged Android page differs from the generated diagnostics page.'
            }
            $pageText = Get-Content -LiteralPath $generated -Raw
            foreach ($marker in @('sightline-lan-diag-v1', 'hostFingerprints', 'clientSnapshotReceiveGapMs', 'totalInterval>0', 'Start / stop frame diagnostics', 'drawingBufferDeviceScalePercent', 'MOBILE_CLARITY_SCALE', 'mobileCharacterAtlasScale', 'MOBILE_COMPETITIVE_SCALE', 'androidEffectiveHz', 'androidSelectedCap', 'androidBatterySaver', 'androidThermalStatus', 'tickAndroidPerformance', 'finishAndroidFpsProbe', 'mobileSettingsHtml', 'mpConfirmRules', '--left-action-base')) {
              if (-not $pageText.Contains($marker)) { throw "Missing packaged capture marker: $marker" }
            }
            foreach ($marker in @('MOBILE_SETUP_PROFILES', 'MOBILE_SETUP_CATEGORIES', 'restoreMobileSetup', 'Training Aim Lock', 'blockMobileAimForLan', 'slBootReady', 'touchMoveGain')) {
              if (-not $pageText.Contains($marker)) { throw "Missing packaged Smart Setup or aim training marker: $marker" }
            }
          } finally { $archive.Dispose() }
          $deliverables = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'sightline-acceptance')
          Copy-Item -LiteralPath $apks[0].FullName -Destination (Join-Path $deliverables.FullName 'sightline-p0-emergency-recovery.apk')
          $hostBundle = (Get-FileHash -LiteralPath (Join-Path $hostRoot 'index.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hostInventory = (Get-FileHash -LiteralPath (Join-Path $hostRoot 'SHA256SUMS') -Algorithm SHA256).Hash.ToLowerInvariant()
          $windowsArtifact = 'sightline-windows-host.zip'
          $hostArchive = Join-Path $deliverables.FullName $windowsArtifact
          git archive --format=zip --output=$hostArchive $sourceCommit -- AGENTS.md START-HOST.bat SIGHTLINE.bat docs/DEV20-LAN-ACCEPTANCE.md docs/DEV24-DEVICE-ACCEPTANCE.md docs/ANDROID-DEVICE-FPS.md AndroidProject/app/src/main/assets/phone-host
          if ($LASTEXITCODE -ne 0) { throw 'Matching Windows host archive failed.' }
          $windowsSha = (Get-FileHash -LiteralPath $hostArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -LiteralPath $apks[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $report = @(
            'variant=diagnostic'
            'package=com.sightline.v3.diagnostic.acceptance'
            "version_code=$versionCode"
            'apk=sightline-p0-emergency-recovery.apk'
            "sha256=$sha256"
            "signing_certificate_sha256=$signerHash"
            'dev24_0_installation=side-by-side'
            'prior_acceptance_installation=in-place-update-with-data-retention'
            "source_commit=$sourceCommit"
            "workflow_commit=$env:GITHUB_SHA"
            "windows_host=$windowsArtifact"
            "windows_host_sha256=$windowsSha"
            "host_bundle_sha256=$hostBundle"
            "host_inventory_sha256=$hostInventory"
            'source_movement_comparison=DEV24.9 deterministic simulation PASS'
            'source_movement_reference=24c9034ae5f1a92e90491d5c9a7aa4b37b9acb6a'
            'device_movement_acceptance=UNVERIFIED'
            'runtime_acceptance=UNVERIFIED'
          ) -join "`n"
          $reportPath = Join-Path $deliverables.FullName 'diagnostic-build.txt'
          [IO.File]::WriteAllText($reportPath, $report, [Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath 'docs/DEV24-DIAGNOSTIC-MIGRATION.md' -Destination (Join-Path $deliverables.FullName 'MIGRATION.md')
          Copy-Item -LiteralPath 'docs/DEV24-DEVICE-ACCEPTANCE.md' -Destination (Join-Path $deliverables.FullName 'DEVICE-ACCEPTANCE.md')
          Copy-Item -LiteralPath 'docs/ANDROID-DEVICE-FPS.md','tools/diagnostic-storage-transfer.js' -Destination $deliverables.FullName
          $instructions = @(
            '# Sightline V3 P0 emergency gameplay recovery diagnostic'
            ''
            'Compare the downloaded APK hash with diagnostic-build.txt. In Windows CMD, run: certutil -hashfile sightline-p0-emergency-recovery.apk SHA256'
            ''
            'Leave DEV24.0 installed. It uses a separate package and its data is independent.'
            'Use a separate compatible phone to keep the prior Sightline Acceptance APK installed exactly as it is. Keep the previous artifact for comparison.'
            'For an in-place update on the same phone, confirm the Sightline Acceptance update prompt or run adb install -r sightline-p0-emergency-recovery.apk using an already authorized connection. Android replaces the installed Sightline Acceptance APK and retains its app data. Never uninstall either app or clear app data.'
            'See MIGRATION.md for optional transfer of offline settings and records.'
            ''
            'Follow DEVICE-ACCEPTANCE.md for the physical-device checks and Windows CMD commands.'
            'Check cold and warm startup. On the same map, mode, graphics settings and refresh rate, compare stationary camera swipes with continuous walking; then walk while swiping, ADS aiming, firing and reloading. Also check strafing and sprinting.'
            'In Settings, apply each Smart Setup profile, restart and confirm the saved settings, then restore the previous setup.'
            'In offline bot practice, select Training Aim Lock, use ADS and swipe near a visible opponent. You still fire each shot. Leave the setting enabled and verify that there is no assistance in LAN play, including after reconnecting.'
            ''
            'Windows LAN: extract sightline-windows-host.zip, run START-HOST.bat in CMD and open http://WINDOWS_LAN_IP:8080/?lanDiag=1 using the bound private IPv4 address.'
            'Physical-device acceptance: UNVERIFIED.'
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $deliverables.FullName 'INSTALL.txt'), $instructions, [Text.UTF8Encoding]::new($false))
          Write-Output $report
          @('## Android diagnostic build', '', $report) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload private diagnostic artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sightline-p0-emergency-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/sightline-acceptance/*
          if-no-files-found: error
          retention-days: 14
